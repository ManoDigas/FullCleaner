name: Build FullCleaner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name full_cleaner --org com.manodigas

      - name: Enable installed-app visibility for GitHub build
        shell: python
        run: |
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text.replace(marker, marker + '\n    ' + permission)
              manifest.write_text(text, encoding='utf-8')

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --project-name full_cleaner --org com.manodigas

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Windows
          path: build/windows/x64/runner/Release/
