name: Build FullCleaner

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Start Android diagnostic log
        run: |
          echo "FullCleaner Android CI diagnostics" > android-ci.log
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> android-ci.log
          echo "Commit: $GITHUB_SHA" >> android-ci.log

      - name: Generate Android platform files
        shell: bash
        run: |
          set -o pipefail
          flutter create . --platforms=android --project-name full_cleaner --org com.manodigas 2>&1 | tee -a android-ci.log

      - name: Install FullCleaner Android bridge
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p android/app/src/main/kotlin/com/manodigas/full_cleaner
            cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/manodigas/full_cleaner/MainActivity.kt
            echo "Android bridge installed."
          } 2>&1 | tee -a android-ci.log

      - name: Configure Android permissions
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee -a android-ci.log
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in text:
              raise SystemExit('AndroidManifest.xml format was not recognized')

          permissions = [
              '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />',
          ]
          missing = [permission for permission in permissions if permission not in text]
          if missing:
              text = text.replace(
                  marker,
                  marker + '\n    ' + '\n    '.join(missing),
                  1,
              )
              manifest.write_text(text, encoding='utf-8')
          print('Android package visibility and uninstall permissions configured.')
          PY

      - name: Get dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a android-ci.log

      - name: Analyze app sources
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib 2>&1 | tee -a android-ci.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a android-ci.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Android failure diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Android build failure"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            if [ -f android-ci.log ]; then
              tail -n 180 android-ci.log
            else
              echo "android-ci.log was not created; failure happened before diagnostic logging started."
            fi
            echo '```'
          } > android-failure.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CI] Android build failure #$GITHUB_RUN_NUMBER" --body-file android-failure.md

  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --project-name full_cleaner --org com.manodigas

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
