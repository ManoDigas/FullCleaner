name: Build FullCleaner

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or ref to build
        required: true
        default: feature/initial-fullcleaner

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name full_cleaner --org com.manodigas

      - name: Install FullCleaner Android bridge
        run: |
          mkdir -p android/app/src/main/kotlin/com/manodigas/full_cleaner
          cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/manodigas/full_cleaner/MainActivity.kt

      - name: Enable installed-app visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml format was not recognized')
              text = text.replace(marker, marker + '\n    ' + permission, 1)
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --project-name full_cleaner --org com.manodigas

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
